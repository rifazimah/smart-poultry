server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Berkas hasil build memakai hash pada nama, aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html tidak di-cache agar versi baru langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rute SPA (mis. /kandang/abc): arahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
