# Smart Poultry — compose untuk development lokal
# Menjalankan PostgreSQL yang identik untuk setiap anggota tim. Setiap anggota punya database
# SENDIRI di komputernya (tidak ada database bersama). Panduan lengkap: docs/panduan/setup-backend.md
#
# Pakai:
#   docker compose up -d          # jalankan di latar belakang
#   docker compose ps             # tunggu sampai STATUS "healthy"
#   docker compose down           # hentikan (data tetap ada di volume)
#   docker compose down -v        # hentikan DAN hapus semua data (HATI-HATI!)
#
# Port 5432 di host bentrok dengan Postgres lain? Ubah lewat environment:
#   POSTGRES_PORT=5433 docker compose up -d     (lalu sesuaikan port di DATABASE_URL pada .env)

services:
  db:
    image: postgres:16-alpine
    container_name: smart-poultry-db
    restart: unless-stopped
    environment:
      # Kredensial HANYA untuk lokal. Jangan dipakai di server yang dapat diakses publik.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: popuri123
      POSTGRES_DB: smart_poultry
    ports:
      # Membuka port ke host agar Alembic/uvicorn/pytest yang berjalan di luar Docker
      # dapat tersambung lewat localhost:${POSTGRES_PORT:-5432}.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume — data bertahan setelah `docker compose down` (tanpa -v).
      - smart_poultry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_poultry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend dalam container (opsional). Tidak ikut menyala pada `docker compose up -d` biasa; jalankan dengan:
  #   docker compose --profile app up -d --build
  # Migrasi Alembic dijalankan otomatis saat container start. Panduan: docs/panduan/operasional.md
  backend:
    profiles: ["app"]
    build: ./smart-poultry-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://admin:popuri123@db:5432/smart_poultry
      JWT_SECRET: ${JWT_SECRET:-dev-only-ganti-di-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Origin frontend yang boleh memanggil API (daftar JSON). Tambahkan alamat publik frontend di server.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:8080"]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend statis (Nginx) dalam container (opsional). Jalankan dengan:
  #   docker compose --profile web up -d --build
  # Alamat backend ditanam saat build: VITE_API_BASE_URL=http://localhost:8000 (origin saja). Panduan: docs/panduan/frontend.md
  web:
    profiles: ["web"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  smart_poultry_pgdata:
