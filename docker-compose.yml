# Smart Poultry — compose untuk development lokal
# Menjalankan PostgreSQL yang identik untuk setiap anggota tim. Setiap anggota punya database
# SENDIRI di komputernya (tidak ada database bersama). Panduan lengkap: docs/panduan/setup-backend.md
#
# Pakai:
#   docker compose up -d          # jalankan di latar belakang
#   docker compose ps             # tunggu sampai STATUS "healthy"
#   docker compose down           # hentikan (data tetap ada di volume)
#   docker compose down -v        # hentikan DAN hapus semua data (HATI-HATI!)
#
# Port 5432 di host bentrok dengan Postgres lain? Ubah lewat environment:
#   POSTGRES_PORT=5433 docker compose up -d     (lalu sesuaikan port di DATABASE_URL pada .env)

services:
  db:
    image: postgres:16-alpine
    container_name: smart-poultry-db
    restart: unless-stopped
    environment:
      # Kredensial HANYA untuk lokal. Jangan dipakai di server yang dapat diakses publik.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: popuri123
      POSTGRES_DB: smart_poultry
    ports:
      # Membuka port ke host agar Alembic/uvicorn/pytest yang berjalan di luar Docker
      # dapat tersambung lewat localhost:${POSTGRES_PORT:-5432}.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume — data bertahan setelah `docker compose down` (tanpa -v).
      - smart_poultry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_poultry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smart_poultry_pgdata:
